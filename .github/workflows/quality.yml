name: Quality Metrics

on:
  push:
    branches: [ "main", "develop", "developer" ]
  pull_request:
    branches: [ "main", "develop", "developer" ]

jobs:
  backend-quality:
    name: Backend Quality & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Linters and Formatters
      run: |
        flake8 src tests || echo "Flake8 issues found"
        black --check src tests || echo "Black issues found"
        isort --check-only src tests || echo "Isort issues found"

    - name: Run Tests & Coverage
      run: |
        pytest --cov=src --cov-report=xml --cov-report=term

  frontend-quality:
    name: Frontend Quality & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint || echo "ESLint issues found"

    - name: Run Type Check
      run: npm run type-check || echo "Type check issues found"

    - name: Run Tests & Coverage
      run: |
        npm install -D @vitest/coverage-v8
        npx vitest run --coverage || echo "Tests failed"

  duplication-check:
    name: Code Duplication Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install jscpd
      run: npm install -g jscpd

    - name: Run jscpd on Backend
      run: jscpd ./backend/src --threshold 5 || echo "Duplications found in backend"

    - name: Run jscpd on Frontend
      run: jscpd ./frontend/src --threshold 5 || echo "Duplications found in frontend"
